events {
    worker_connections 1024;
}

http {
    #Обработка различных типов фалов
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Сервер для Django-приложений
    upstream django {
        server web:8000;
    }

    # Настраиваем сервер
    server {
        listen 80;
        server_name _;

        # Определяем обработку к статическим файлам
        location /static/ {
            alias /app/staticfiles/;
;             expires max;
;             access_log off;
        }

;         location /static/rest_framework/ {
;             alias /usr/local/lib/python3.10/site-packages/rest_framework/static/rest_framework/;
;         }

        # Проксируем остальные запросы к Django-приложению
        location / {
            proxy_pass http://django;
;             proxy_set_header Host $host;
;             proxy_set_header X-Real-IP $remote_addr;
;             proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}